# Example: Combined API + Worker Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-parser-combined
  namespace: ai-underwriter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: document-parser-combined
  template:
    metadata:
      labels:
        app: document-parser-combined
    spec:
      containers:
      # Container 1: API Server
      - name: api
        image: 794038237159.dkr.ecr.us-west-1.amazonaws.com/document-parser-dev:latest
        command: ["python3", "-m", "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8003"]
        ports:
        - containerPort: 8003
        env:
        - name: PARSER_ENVIRONMENT
          value: "production"
        # ... all your environment variables from secret manager
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi" 
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/v1/health/live
            port: 8003
          initialDelaySeconds: 30
          periodSeconds: 10
      
      # Container 2: Worker
      - name: worker
        image: 794038237159.dkr.ecr.us-west-1.amazonaws.com/document-parser-dev:latest
        command: ["python3", "-m", "src.services.worker"]
        env:
        - name: PARSER_ENVIRONMENT
          value: "production"
        # ... all your environment variables from secret manager
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        # No health check for worker (it's a background process)
      
      # Shared resources
      volumes:
      - name: tmp-storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: document-parser-combined
spec:
  selector:
    app: document-parser-combined
  ports:
  - port: 80
    targetPort: 8003
  type: ClusterIP
