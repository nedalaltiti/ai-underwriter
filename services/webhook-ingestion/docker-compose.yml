# services/webhook-ingestion/docker-compose.yml
version: '3.8'

services:
  webhook-ingestion:
    build:
      context: ../..  # Build from root directory
      dockerfile: services/webhook-ingestion/Dockerfile
    image: ai-underwriter/webhook-ingestion:latest
    container_name: webhook-ingestion
    ports:
      - "8001:8000"
    environment:
      # Override any config values here
      - WEBHOOK_ENVIRONMENT=development
      - WEBHOOK_LOG_LEVEL=INFO
      - WEBHOOK_AWS_REGION=${AWS_REGION:-us-west-1}
      - WEBHOOK_UW_UPLOADED_DOCS_QUEUE=${UW_UPLOADED_DOCS_QUEUE}
      - WEBHOOK_UW_UPLOADED_DOCS_DLQ=${UW_UPLOADED_DOCS_DLQ}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:?WEBHOOK_SECRET is required for authentication}
      - WEBHOOK_RATE_LIMIT_ENABLED=true
      - WEBHOOK_RATE_LIMIT_REQUESTS=100
      - WEBHOOK_CORS_ORIGINS=http://localhost:3000,http://localhost:8000
    volumes:
      # For development - mount source code
      - ./src:/app/src:ro
      - ../../libs:/app/libs:ro
    networks:
      - ai-underwriter
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  ai-underwriter:
    external: true 