# services/document-parser/docker-compose.prod.yml
version: '3.8'

services:
  document-parser:
    build:
      context: ../..  # Build from root directory
      dockerfile: services/document-parser/Dockerfile
      args:
        BUILD_DATE: ${BUILD_DATE:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}
        VERSION: ${VERSION:-latest}
        SERVICE_NAME: document-parser
    image: ai-underwriter/document-parser:${VERSION:-latest}
    container_name: document-parser
    restart: unless-stopped
    
    ports:
      - "8003:8003"
    
    environment:
      # Core service configuration
      PARSER_ENVIRONMENT: ${PARSER_ENVIRONMENT:-production}
      PARSER_LOG_LEVEL: ${PARSER_LOG_LEVEL:-INFO}
      PARSER_SERVICE_NAME: document-parser
      PARSER_SERVICE_VERSION: ${VERSION:-1.0.0}
      
      # Server configuration
      PARSER_HOST: ${PARSER_HOST:-0.0.0.0}
      PARSER_PORT: ${PARSER_PORT:-8003}
      PARSER_WORKERS: ${PARSER_WORKERS:-4}
      
      # AWS Configuration
      PARSER_AWS_REGION: ${PARSER_AWS_REGION:-us-west-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${PARSER_AWS_REGION:-us-west-1}
      
      # SQS Configuration
      PARSER_INPUT_QUEUE_NAME: ${PARSER_INPUT_QUEUE_NAME:-uw-downloaded-docs-dev-sqs.fifo}
      PARSER_OUTPUT_QUEUE_NAME: ${PARSER_OUTPUT_QUEUE_NAME:-}
      
      # S3 Configuration
      PARSER_S3_BUCKET_NAME: ${PARSER_S3_BUCKET_NAME:-contact-contracts-dev-s3-us-west-1}
      PARSER_S3_PREFIX: ${PARSER_S3_PREFIX:-}
      
      # Database Configuration
      PARSER_DATABASE_URL: ${PARSER_DATABASE_URL}
      
      # Gemini Configuration
      PARSER_GEMINI_PROJECT_ID: ${PARSER_GEMINI_PROJECT_ID:-gemini-deployment}
      PARSER_GEMINI_REGION: ${PARSER_GEMINI_REGION:-us-central1}
      PARSER_GEMINI_MODEL: ${PARSER_GEMINI_MODEL:-gemini-2.0-flash}
      PARSER_GEMINI_TEMPERATURE: ${PARSER_GEMINI_TEMPERATURE:-0.1}
      PARSER_GEMINI_TIMEOUT: ${PARSER_GEMINI_TIMEOUT:-300}
      PARSER_GEMINI_SERVICE_ACCOUNT: ${PARSER_GEMINI_SERVICE_ACCOUNT}
      
      # Processing Configuration
      PARSER_WORKER_CONCURRENCY: ${PARSER_WORKER_CONCURRENCY:-5}
      PARSER_PROCESSING_TIMEOUT: ${PARSER_PROCESSING_TIMEOUT:-600}
      PARSER_MAX_FILE_SIZE_MB: ${PARSER_MAX_FILE_SIZE_MB:-100}
      PARSER_MAX_RETRIES: ${PARSER_MAX_RETRIES:-3}
      PARSER_RETRY_DELAY: ${PARSER_RETRY_DELAY:-60}
      
      # Observability
      PARSER_ENABLE_METRICS: ${PARSER_ENABLE_METRICS:-true}
      PARSER_ENABLE_TRACING: ${PARSER_ENABLE_TRACING:-true}
      PARSER_TRACE_SAMPLE_RATE: ${PARSER_TRACE_SAMPLE_RATE:-0.1}
    
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G
    
    # Security enhancements
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    read_only: false  # Need write access for temp processing
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /app/temp:noexec,nosuid,size=500m
    
    # Health check configuration
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/api/v1/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service,environment,version"
    
    # Labels for service discovery and monitoring
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.document-parser.rule=Host(`document-parser.local`)"
      - "traefik.http.routers.document-parser.entrypoints=web"
      - "traefik.http.services.document-parser.loadbalancer.server.port=8003"
      - "com.docker.compose.service=document-parser"
      - "com.docker.compose.project=${COMPOSE_PROJECT_NAME:-ai-underwriter}"
      - "service.name=document-parser"
      - "service.version=${VERSION:-latest}"
      - "service.environment=${PARSER_ENVIRONMENT:-production}"

networks:
  default:
    name: ai-underwriter-network
    external: true