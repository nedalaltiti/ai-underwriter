# services/document-parser/docker-compose.prod.yml
# Production deployment configuration for document-parser service

services:
  document-parser-api:
    build:
      context: ../..
      dockerfile: services/document-parser/Dockerfile
    container_name: document-parser-api
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      - PARSER_ENVIRONMENT=production
      - PARSER_LOG_LEVEL=INFO
      - PARSER_HOST=0.0.0.0
      - PARSER_PORT=8003
      - PARSER_WORKERS=4
    env_file:
      - .env.prod
    volumes:
      - ./logs:/app/logs
    networks:
      - ai-underwriter-network
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/api/v1/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  document-parser-worker:
    build:
      context: ../..
      dockerfile: services/document-parser/Dockerfile
    restart: unless-stopped
    command: ["python3", "-m", "src.services.worker"]
    environment:
      - PARSER_ENVIRONMENT=production
      - PARSER_LOG_LEVEL=INFO
      - PARSER_WORKER_CONCURRENCY=10
    env_file:
      - .env.prod
    volumes:
      - ./logs:/app/logs
    networks:
      - ai-underwriter-network
    depends_on:
      - postgres
    deploy:
      replicas: 3  # Scale workers for high throughput
      resources:
        limits:
          memory: 2G
          cpus: '1.0'

  postgres:
    image: postgres:15-alpine
    container_name: document-parser-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=ai_underwriting
      - POSTGRES_USER=ai_underwriting_user
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - ai-underwriter-network
    ports:
      - "3307:5432"

  nginx:
    image: nginx:alpine
    container_name: document-parser-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    networks:
      - ai-underwriter-network
    depends_on:
      - document-parser-api

  prometheus:
    image: prom/prometheus:latest
    container_name: document-parser-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - ai-underwriter-network

volumes:
  postgres_data:
  prometheus_data:

networks:
  ai-underwriter-network:
    driver: bridge