[project]
name            = "ai-underwriting"
version         = "1.0.0"
description     = "Event-driven AI underwriting platform"
authors         = [{ name = "Nedal Altiti", email = "nedal.a@usclarity.com" }]
requires-python = ">=3.11"

# --- Core, shared across services ---
dependencies = [
    # Web & ASGI
    "fastapi~=0.116.1",           
    "uvicorn[standard]~=0.35.0",

    # Settings & validation
    "pydantic~=2.11.7",
    "pydantic-settings~=2.10.1",
    "python-dotenv~=1.1.1",

    # Data & storage
    "sqlalchemy[asyncio]~=2.0.41",
    "asyncpg~=0.30.0",
    "alembic~=1.16.4",

    # AWS (S3, SQS)
    "aioboto3~=15.0.0",

    # HTTP & I/O
    "httpx[http2]~=0.28.1",
    "aiofiles~=24.1.0",

    # Security / Auth (only in webhook-ingestion)
    "python-jose[cryptography]~=3.5.0",
    "passlib[bcrypt]~=1.7.4",
    "python-multipart~=0.0.20",

    # Observability
    "loguru~=0.7.3",
    "structlog~=25.4.0",
    "prometheus-client~=0.22.1",
    "opentelemetry-api~=1.35.0",
    "opentelemetry-sdk~=1.35.0",
    "opentelemetry-instrumentation-fastapi~=0.56b0",
    "prometheus-fastapi-instrumentator~=7.1.0",

    # Utilities
    "tenacity~=9.1.2",
    "python-dateutil~=2.9.0.post0",
    "shortuuid~=1.0.13",
    "click~=8.2.1",
    "rich~=14.0.0",
]

# --- Optional groups ---
[project.optional-dependencies]

## Contract-parser only
parser = [
    # LLM providers
    "google-genai~=1.0.0",
    # LangChain core pieces (lightweight; agents/plugins kept out)
    "langchain-core~=0.3.68",
    "langchain-community~=0.3.27",
    "tiktoken~=0.9.0",

    # PDF / doc handling
    "pypdf~=5.7.0",
    "pymupdf~=1.26.3",
    "pillow~=11.3.0",
    "python-magic~=0.4.27",
    "orjson~=3.10.18",  # fast JSON for LLM streaming
]

## Dev / CI
dev = [
    # Testing
    "pytest~=8.4.1",
    "pytest-asyncio~=1.0.0",
    "pytest-cov~=6.2.1",
    "pytest-mock~=3.14.1",

    # Linting & formatting
    "ruff~=0.12.3",
    "black~=25.1.0",
    "mypy~=1.16.1",
    "pre-commit~=4.2.0",

    # Docs
    "mkdocs~=1.6.0",
    "mkdocs-material~=9.5.2",

    # Live-reload & notebooks
    "uv~=0.7.20",
    "ipython~=9.4.0",
    "jupyter~=1.1.1",
    "watchfiles~=1.1.0",
]

## Production runtime
prod = [
    "gunicorn~=23.0.0",
    "uvloop~=0.21.0",
    "sentry-sdk[fastapi]~=2.32.0",
    "orjson~=3.10.1",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

# --- Tooling configs (unchanged except for tighter paths) ---

[tool.setuptools.packages.find]
where = ["shared", "services"]

[tool.pytest.ini_options]
pythonpath   = ["shared", "services"]
asyncio_mode = "auto"
testpaths    = ["tests"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length    = 88
target-version = "py311"
select         = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore         = ["E501", "B008", "C901"]

[tool.mypy]
python_version           = "3.11"
disallow_untyped_defs    = true
disallow_any_generics    = true
ignore_missing_imports   = true
show_error_codes         = true

